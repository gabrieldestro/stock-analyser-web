<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#161b22" />
  <meta name="description" content="Visualizador de análises de ativos e chat com IA" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="StockAnalyser" />
  <title>Stock Exchange Analyser</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />

  <!-- CDN Libraries (window globals, zero-build) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <button class="btn-icon" id="btn-hamburger" title="Menu" aria-label="Abrir/fechar menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <div class="navbar-brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      <span class="navbar-title">Stock Exchange Analyser</span>
    </div>
    <div class="navbar-actions">
      <button class="btn-icon" id="btn-ai" title="Chat com IA" aria-label="Abrir chat IA" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </button>
      <button class="btn-icon" id="btn-settings" title="Configurações" aria-label="Abrir configurações">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.07 4.93l-1.41 1.41M4.93 4.93l1.41 1.41M19.07 19.07l-1.41-1.41M4.93 19.07l1.41-1.41M12 2v2M12 20v2M2 12h2M20 12h2"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- Sidebar Overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-search-wrapper">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="search-input" class="search-input" placeholder="Buscar relatórios..." aria-label="Buscar relatórios" />
      </div>
    </div>
    <div class="sidebar-reports" id="sidebar-reports">
      <div class="sidebar-empty">
        <div class="spinner"></div>
        <p>Carregando relatórios...</p>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content" id="main-content">
    <div class="welcome-screen" id="welcome-screen">
      <div class="welcome-icon">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
      </div>
      <h2>Bem-vindo ao Stock Exchange Analyser</h2>
      <p class="text-muted">Selecione um relatório na barra lateral para começar a análise.</p>
      <p class="text-muted">Use o botão <strong>⚙️</strong> para configurar suas credenciais.</p>
    </div>

    <div class="report-view" id="report-view" style="display:none;">
      <!-- Tabs -->
      <div class="tabs-bar" id="tabs-bar">
        <button class="tab-btn active" data-tab="summary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Resumo
        </button>
        <button class="tab-btn" data-tab="history">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          Análise Histórica
        </button>
        <button class="tab-btn" data-tab="data">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
          Dados &amp; Gráficos
        </button>
      </div>

      <!-- Tab Panels -->
      <div class="tab-panel active" id="tab-summary">
        <div class="markdown-content" id="markdown-content">
          <!-- rendered markdown here -->
        </div>
      </div>

      <div class="tab-panel" id="tab-history">
        <div class="markdown-content" id="markdown-history">
          <!-- history section rendered here -->
        </div>
      </div>

      <div class="tab-panel" id="tab-data">
        <div class="quote-panel" id="quote-panel" style="display:none;"></div>
        <div class="chart-container" id="chart-container">
          <div id="main-chart" style="width:100%; height:400px;"></div>
        </div>
        <div class="markdown-content" id="markdown-data">
          <!-- data tables rendered here -->
        </div>
      </div>
    </div>
  </main>

  <!-- Settings Modal (rendered by SettingsModal.js) -->
  <div id="settings-modal-root"></div>

  <!-- Chat Drawer (rendered by ChatDrawer.js) -->
  <div id="chat-drawer-root"></div>

  <!-- Main App Module -->
  <script type="module" src="src/presentation/app.js"></script>
</body>
</html>
